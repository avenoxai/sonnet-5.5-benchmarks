<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@300;400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#efe8d8; --ink2:#b9b19f; --ink3:#857e6e;
  --glass:rgba(12,14,22,.56); --glass-hi:rgba(255,255,255,.07); --line:rgba(255,255,255,.11);
  --amber:#ffb85c; --amber-d:#ff8a3d; --bg:#05070d;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:var(--sans)}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#gl:active{cursor:grabbing}
#ui{position:fixed;inset:0;pointer-events:none;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(14px,env(safe-area-inset-bottom,0px));box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .5s}
#ui::before,#ui::after{content:"";position:absolute;left:0;right:0;pointer-events:none;z-index:-1;transition:opacity .5s}
#ui::before{top:0;height:190px;background:linear-gradient(180deg,rgba(6,8,16,.5),rgba(6,8,16,0))}
#ui::after{bottom:0;height:260px;background:linear-gradient(0deg,rgba(6,8,16,.42),rgba(6,8,16,0))}
#ui.hidden::before,#ui.hidden::after{opacity:0}
#ui.hidden .hideable{opacity:0;pointer-events:none;transform:translateY(6px)}
.hideable{transition:opacity .45s,transform .45s}
#ui button,#ui input,#ui .pane,#ui #track{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
#brand{min-width:0}
.kicker{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber);font-weight:600}
h1{margin:4px 0 2px;font:600 clamp(28px,4.4vw,46px)/1.02 var(--serif);letter-spacing:.005em;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.55)}
.sub{font-size:12.5px;color:#d8d0bd;letter-spacing:.02em;text-shadow:0 1px 10px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.5)}
#clockbox{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;text-shadow:0 2px 18px rgba(0,0,0,.6)}
#clock{font:300 clamp(34px,5.2vw,58px)/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#date{font-size:12.5px;color:#d8d0bd}
#sunline{font-size:12px;color:#d8d0bd;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-shadow:0 1px 10px rgba(0,0,0,.75)}
#sunline .mn{display:flex;align-items:center;gap:7px}
#moon{width:16px;height:16px;display:inline-block;vertical-align:-3px}
.tbtns{display:flex;gap:8px;margin-bottom:6px;justify-content:flex-end}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);display:grid;place-items:center;padding:0}
.ib:hover{background:rgba(255,255,255,.14)}
.ib svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#hint{align-self:flex-start;font-size:11.5px;color:var(--ink2);letter-spacing:.02em;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:10px;transition:opacity 1.2s;opacity:0}
#hint.on{opacity:1}
@media (hover:none){#hint{display:none}}
#dock{width:100%;max-width:780px;margin:0 auto;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35);box-shadow:0 18px 60px rgba(0,0,0,.45);padding:10px 14px 14px;box-sizing:border-box;pointer-events:auto}
#tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{background:none;border:0;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.03em;color:var(--ink3);white-space:nowrap}
#tabs button.on{color:#1a1206;background:var(--amber)}
#tabs button:not(.on):hover{color:var(--ink)}
.pane{display:none;flex-direction:column;gap:11px;min-width:0}
.pane.on{display:flex}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--glass-hi);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.15)}
.chip.on{border-color:var(--amber);color:var(--amber);background:rgba(255,184,92,.11)}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}
#play{width:38px;height:38px;border-radius:50%;border:0;background:var(--amber);display:grid;place-items:center;flex:none;padding:0}
#play svg{width:15px;height:15px;fill:#1a1206}
#track{position:relative;flex:1;min-width:150px;height:34px;border-radius:10px;cursor:ew-resize;touch-action:none;overflow:hidden;border:1px solid var(--line)}
#trackbg{position:absolute;inset:0}
#track .tk{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18)}
#track .tl{position:absolute;bottom:2px;font-size:9.5px;color:rgba(255,255,255,.75);transform:translateX(-50%);font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#handle{position:absolute;top:-1px;bottom:-1px;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 14px rgba(255,255,255,.7);border-radius:2px}
input[type=date]{background:var(--glass-hi);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 10px;font:500 12px var(--sans);color-scheme:dark}
.sl{display:grid;grid-template-columns:78px 1fr 38px;align-items:center;gap:10px;font-size:12.5px}
.sl output{color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;margin:0;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--amber) var(--v,50%),rgba(255,255,255,.18) var(--v,50%))}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,255,255,.18)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--amber)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:0;margin-top:-6px;box-shadow:0 0 0 3px rgba(255,184,92,.35)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 3px rgba(255,184,92,.35)}
.tg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink)}
.tg button{width:38px;height:22px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.1);position:relative;padding:0}
.tg button::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.tg button.on{background:var(--amber)}
.tg button.on::after{transform:translateX(16px);background:#1a1206}
.note{font-size:11.5px;color:var(--ink3);line-height:1.5}
#loader{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 100%,#1b1420 0%,#07090f 60%);display:grid;place-items:center;z-index:20;transition:opacity 1.1s ease,visibility 1.1s;color:var(--ink)}
#loader.done{opacity:0;visibility:hidden}
.ld{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 24px;text-align:center}
.ld svg{width:min(120px,26vw);height:auto;filter:drop-shadow(0 0 22px rgba(255,150,60,.35))}
.ld .t{font:600 clamp(28px,6vw,40px)/1 var(--serif);letter-spacing:.01em}
.ld .s{font-size:12.5px;color:var(--ink2);min-height:1.4em;letter-spacing:.03em}
.ld .b{width:min(260px,64vw);height:2px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
.ld .b i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}
@media (max-width:560px){
  #dock{padding:8px 10px 12px;border-radius:18px}
  .sl{grid-template-columns:62px 1fr 34px}
  #sunline{display:none}
  .kicker{font-size:9.5px}
}
