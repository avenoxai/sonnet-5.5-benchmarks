<style>
  :root{
    --ink:#0a1118;
    --panel: rgba(12,18,27,0.55);
    --panel-strong: rgba(9,14,21,0.74);
    --line: rgba(233,225,208,0.14);
    --line-strong: rgba(233,225,208,0.26);
    --stone:#cdbfa3;
    --mist:#eef1ee;
    --mist-dim:#a9b2b9;
    --gold:#e2a84f;
    --copper:#bd7a48;
    --font-display:'Cinzel','Iowan Old Style',Georgia,serif;
    --font-body:'Manrope','Segoe UI',system-ui,sans-serif;
    color-scheme: dark;
  }
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--ink);
    overflow:hidden;
    font-family: var(--font-body);
    color: var(--mist);
    -webkit-text-size-adjust:100%;
  }
  #scene{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none; }

  #veil{
    position:fixed; inset:0; z-index:60;
    background: radial-gradient(ellipse at 50% 38%, #182636 0%, #070b12 74%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    transition: opacity 1s ease;
  }
  #veil.hide{ opacity:0; pointer-events:none; }
  #veil svg{ width:44px; height:44px; opacity:.9; animation: veilPulse 2.4s ease-in-out infinite; }
  #veil .label{ font-family:var(--font-display); letter-spacing:.16em; font-size:11px; text-transform:uppercase; color:var(--stone); }
  @keyframes veilPulse{ 0%,100%{opacity:.55} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce){ #veil svg{ animation:none; } }

  .hud{ position:fixed; z-index:10; pointer-events:none; }
  .hud > *{ pointer-events:auto; }

  #mark{ top:0; left:0; right:0; padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left)); display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  #markText{ min-width:0; }
  #mark .name{ font-family:var(--font-display); font-size:16px; letter-spacing:.11em; text-transform:uppercase; color:var(--mist); text-shadow:0 2px 12px rgba(0,0,0,.6); }

  #factToggle svg{ width:12px; height:12px; opacity:.85; flex:none; }
  #fact{
    margin-top:9px; max-width:248px; padding:11px 13px; background:var(--panel); border:1px solid var(--line);
    border-radius:11px; backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%);
    font-size:11.5px; line-height:1.55; color:var(--mist-dim);

  #fact .row{ display:flex; gap:14px; margin-bottom:6px; }

  #compass{ flex:none; width:34px; height:34px; opacity:.85; }

  #dock{ left:50%; bottom:0; transform:translateX(-50%); width:min(94vw, 640px); padding: 0 12px max(16px, env(safe-area-inset-bottom)); }
  #dockInner{
    display:flex; align-items:center; gap:14px; padding:10px 14px;
    background:var(--panel-strong); border:1px solid var(--line); border-radius:17px;
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 20px 44px -14px rgba(0,0,0,.6);
    flex-wrap:wrap;
  }
  button{ font-family:var(--font-body); border:none; background:none; color:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:6px; }

  #playBtn{ width:35px; height:35px; flex:none; border-radius:50%; background:rgba(255,255,255,.06); border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; transition:background .15s; }
  #playBtn:hover{ background:rgba(255,255,255,.13); }
  #playBtn svg{ width:12px; height:12px; fill:var(--mist); }

  #timeWrap{ flex:1 1 160px; display:flex; flex-direction:column; gap:5px; min-width:130px; }
  #timeTop{ display:flex; justify-content:space-between; font-size:10px; letter-spacing:.07em; color:var(--mist-dim); text-transform:uppercase; }
  #clock{ font-variant-numeric:tabular-nums; color:var(--stone); font-weight:700; letter-spacing:.03em; }

  #timeSlider{
    -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:2px; margin:0;
    background: linear-gradient(90deg,#0a1220 0%,#233b57 16%,#e8a24f 26%,#bfe0ef 46%,#dfe9ea 54%,#e6934f 74%,#1b2740 86%,#0a1220 100%);
    outline:none; cursor:pointer;
  }
  #timeSlider::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--mist); border:2px solid #0a1118; box-shadow:0 1px 4px rgba(0,0,0,.5); margin-top:0; cursor:pointer; }
  #timeSlider::-moz-range-thumb{ width:14px; height:14px; border-radius:50%; background:var(--mist); border:2px solid #0a1118; cursor:pointer; }
  #timeSlider::-moz-range-track{ height:4px; border-radius:2px; background:transparent; }

  #camToggle{ display:flex; flex:none; background:rgba(255,255,255,.05); border:1px solid var(--line-strong); border-radius:11px; padding:3px; gap:2px; }
  #camToggle button{ font-size:10.5px; letter-spacing:.05em; padding:7px 11px; border-radius:8px; color:var(--mist-dim); transition:background .15s,color .15s; white-space:nowrap; }
  #camToggle button.active{ background:var(--copper); color:#fff8f0; }

  @media (max-width:480px){
    #dockInner{ gap:9px; padding:9px 10px; border-radius:15px; }
    #camToggle button{ padding:7px 9px; font-size:9.5px; }

  @media (max-width:340px){
    #timeTop{ display:none; }

  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
  noscript{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0a1118; color:#cdbfa3; font-family:sans-serif; text-align:center; padding:24px; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =======================================================================
   GALATA KULESİ — interactive single-file 3D simulation
   Genoese tower (1348), Golden Horn, Istanbul.
   Sections: utils -> renderer/scene -> textures -> materials -> sky ->
   water -> terrain -> tower -> city -> birds -> boats -> lights ->
   day/night -> camera/tour -> UI -> loop
   ======================================================================= */

const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PLAZA_Y = 8; // elevation of the tower's plaza above sea level

/* ---------------------------- utilities ------------------------------ */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(1348);
function hash2(x, y){ const s = Math.sin(x*127.1 + y*311.7) * 43758.5453; return s - Math.floor(s); }
function noise2(x, y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash2(xi,yi), b = hash2(xi+1,yi), c = hash2(xi,yi+1), d = hash2(xi+1,yi+1);
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
}
function fbm(x, y, oct=4){
  let amp=0.5, freq=1, sum=0, norm=0;
  for(let i=0;i<oct;i++){ sum += noise2(x*freq,y*freq)*amp; norm += amp; amp*=0.5; freq*=2; }
  return sum/norm;
}
function smoothstep(e0,e1,x){ const t = THREE.MathUtils.clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }
function angleDiff(a,b){ let d=(a-b)%(Math.PI*2); if(d>Math.PI) d-=Math.PI*2; if(d<-Math.PI) d+=Math.PI*2; return d; }

/* ------------------------- renderer / scene / camera ------------------------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1220, 0.0012);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.4, 4000);
camera.position.set(-138, 64, -172);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 30 + PLAZA_Y, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 24;
controls.maxDistance = 460;
controls.maxPolarAngle = 1.5;
controls.autoRotate = !prefersReduced;
controls.autoRotateSpeed = 0.32;
controls.update();

let userInteracting = false, idleTimer = 0;
controls.addEventListener('start', ()=>{ userInteracting = true; });
controls.addEventListener('end', ()=>{ userInteracting = false; idleTimer = 0; });

/* ------------------------------ dummy for instancing ------------------------------ */
const dummy = new THREE.Object3D();

/* ------------------------------ procedural textures ------------------------------ */
function makeCanvas(size){ const c = document.createElement('canvas'); c.width = c.height = size; return c; }

function makeStoneTextures(size=512){
  const cvs = makeCanvas(size), ctx = cvs.getContext('2d');
  ctx.fillStyle = '#c7b99b'; ctx.fillRect(0,0,size,size);
  for(let i=0;i<3200;i++){
    const x = rng()*size, y = rng()*size, r = 2+rng()*10;
    const tone = 130 + rng()*70;
    ctx.fillStyle = `rgba(${tone|0},${(tone-14)|0},${(tone-34)|0},${0.05+rng()*0.10})`;
    ctx.beginPath(); ctx.ellipse(x,y,r,r*(0.5+rng()*0.6),rng()*Math.PI,0,Math.PI*2); ctx.fill();
  }
  const rows = 15;
  ctx.lineWidth = 1.6;
  for(let r=0;r<rows;r++){
    const y0 = (r+0.5)/rows*size;
    ctx.strokeStyle = 'rgba(84,74,58,0.30)';
    ctx.beginPath();
    for(let x=0;x<=size;x+=16){ const yy = y0 + Math.sin(x*0.05+r)*2.2; x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy); }
    ctx.stroke();
    const stagger = (r%2)*24;
    for(let x=stagger;x<size;x+=48){
      ctx.strokeStyle = 'rgba(84,74,58,0.20)';
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 + size/rows*0.85); ctx.stroke();
    }
  }
  const colorTex = new THREE.CanvasTexture(cvs);
  colorTex.colorSpace = THREE.SRGBColorSpace;

  const cvs2 = makeCanvas(size), ctx2 = cvs2.getContext('2d');
  const img = ctx.getImageData(0,0,size,size);
  const out = ctx2.createImageData(size,size);
  for(let i=0;i<img.data.length;i+=4){
    const v = (img.data[i]*0.3+img.data[i+1]*0.3+img.data[i+2]*0.3) | 0;
    out.data[i]=v; out.data[i+1]=v; out.data[i+2]=v; out.data[i+3]=255;
  }
  ctx2.putImageData(out,0,0);
  const bumpTex = new THREE.CanvasTexture(cvs2);

  [colorTex,bumpTex].forEach(t=>{ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4; });
  return { colorTex, bumpTex };
}

function makeRoofTexture(size=256){
  const cvs = makeCanvas(size), ctx = cvs.getContext('2d');
  ctx.fillStyle = '#495650'; ctx.fillRect(0,0,size,size);
  for(let i=0;i<900;i++){
    const x=rng()*size,y=rng()*size,r=1+rng()*4;
    const g = rng()>0.5 ? '58,72,64' : '40,48,44';
    ctx.fillStyle = `rgba(${g},${0.08+rng()*0.14})`;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(cvs);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function makeCobbleTexture(size=512){
  const cvs = makeCanvas(size), ctx = cvs.getContext('2d');
  ctx.fillStyle = '#6b6459'; ctx.fillRect(0,0,size,size);
  const cell = 22;
  for(let y=-cell;y<size+cell;y+=cell){
    for(let x=-cell;x<size+cell;x+=cell){
      const jx = x + (rng()-0.5)*8 + ((y/cell|0)%2? cell/2:0);
      const jy = y + (rng()-0.5)*8;
      const r = cell*0.42*(0.8+rng()*0.3);
      const tone = 92 + rng()*46;
      const grad = ctx.createRadialGradient(jx-r*0.3,jy-r*0.3,1,jx,jy,r);
      grad.addColorStop(0, `rgb(${tone+22|0},${tone+18|0},${tone+8|0})`);
      grad.addColorStop(1, `rgb(${tone-20|0},${tone-24|0},${tone-30|0})`);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(jx,jy,r,r*(0.85+rng()*0.2),rng()*Math.PI,0,Math.PI*2); ctx.fill();
    }
  }
  const tex = new THREE.CanvasTexture(cvs);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function makeBuildingTexture(size=256){
  const cvs = makeCanvas(size), ctx = cvs.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);
  for(let i=0;i<500;i++){
    const x=rng()*size,y=rng()*size;
    ctx.fillStyle = `rgba(0,0,0,${0.02+rng()*0.05})`;
    ctx.fillRect(x,y,2+rng()*3,2+rng()*3);
  }
  const cols = 7, rows = 11;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(rng()<0.16) continue;
      const w = size/cols, h = size/rows;
      const x = c*w + w*0.22, y = r*h + h*0.18;
      const ww = w*0.56, hh = h*0.62;
      const lit = rng()<0.4;
      ctx.fillStyle = lit ? '#ffe3ad' : 'rgba(20,22,26,0.75)';
      ctx.fillRect(x,y,ww,hh);
    }
  }
  const tex = new THREE.CanvasTexture(cvs);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function makeGlowTexture(size=256){
  const cvs = makeCanvas(size), ctx = cvs.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0,'rgba(255,214,150,0.9)');
  g.addColorStop(0.35,'rgba(255,190,110,0.4)');
  g.addColorStop(1,'rgba(255,180,100,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,size,size);
  const tex = new THREE.CanvasTexture(cvs);
  return tex;
}

function makeFlagTexture(){
  const w=300,h=200; const cvs = document.createElement('canvas'); cvs.width=w; cvs.height=h;
  const ctx = cvs.getContext('2d');
  ctx.fillStyle = '#e30a17'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(w*0.40,h*0.5,h*0.30,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#e30a17';
  ctx.beginPath(); ctx.arc(w*0.445,h*0.5,h*0.245,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  const cx=w*0.58, cy=h*0.5, R=h*0.14, rI=h*0.06;
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a1 = -Math.PI/2 + i*(Math.PI*2/5);
    const a2 = a1 + Math.PI/5;
    ctx.lineTo(cx+Math.cos(a1)*R, cy+Math.sin(a1)*R);
    ctx.lineTo(cx+Math.cos(a2)*rI, cy+Math.sin(a2)*rI);
  }
  ctx.closePath(); ctx.fill();
  const tex = new THREE.CanvasTexture(cvs);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const stoneTex = makeStoneTextures();
stoneTex.colorTex.repeat.set(5,7); stoneTex.bumpTex.repeat.set(5,7);
const roofTex = makeRoofTexture(); roofTex.repeat.set(6,3);
const cobbleTex = makeCobbleTexture(); cobbleTex.repeat.set(10,10);
const buildingTex = makeBuildingTexture();
const glowTex = makeGlowTexture();
const flagTex = makeFlagTexture();

/* -------------------------------- materials -------------------------------- */
const stoneMat = new THREE.MeshStandardMaterial({ map: stoneTex.colorTex, bumpMap: stoneTex.bumpTex, bumpScale:0.16, roughness:0.93, metalness:0.02 });
const stoneDarkMat = new THREE.MeshStandardMaterial({ color:0x9c9074, map: stoneTex.colorTex, roughness:0.95, metalness:0.02 });

  uTop: { value: new THREE.Color(0x274a72) },
  uHorizon: { value: new THREE.Color(0xf0844f) },
  uSunDir: { value: new THREE.Vector3(0,1,0) },
  uSunColor: { value: new THREE.Color(0xffe9c8) },
  uMoonDir: { value: new THREE.Vector3(0,-1,0) },
  uMoonVis: { value: 0 },
  uStar: { value: 0 },
  uTime: { value: 0 },
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  vertexShader: `
    varying vec3 vDir;
    void main(){
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vDir;
    uniform vec3 uTop, uHorizon, uSunDir, uSunColor, uMoonDir;
    uniform float uMoonVis, uStar, uTime;
    float hash3(vec3 p){ return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453); }
    void main(){
      vec3 dir = normalize(vDir);
      float t = smoothstep(-0.06, 0.62, dir.y);
      vec3 col = mix(uHorizon, uTop, t);

      float sunAmt = max(dot(dir, normalize(uSunDir)), 0.0);
      float sunDisc = smoothstep(0.9982, 0.9994, sunAmt);
      float sunGlow = pow(sunAmt, 220.0) * 0.5 + pow(sunAmt, 6.0) * 0.22;
      col += uSunColor * (sunDisc*2.2 + sunGlow);

      float moonAmt = max(dot(dir, normalize(uMoonDir)), 0.0);
      float moonDisc = smoothstep(0.9988, 0.9997, moonAmt);
      col += vec3(0.82,0.86,0.95) * moonDisc * uMoonVis * 1.6;

      if(uStar > 0.005 && dir.y > 0.015){
        vec3 g = floor(dir*230.0);
        float s = hash3(g);
        float m = step(0.9974, s);
        float tw = 0.55 + 0.45*sin(uTime*2.6 + s*80.0);
        col += vec3(1.0,0.98,0.94) * m * uStar * tw;
      }
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1650, 40, 26), skyMat));

const waterUniforms = {

  uSkyHorizon: { value: new THREE.Color(0xf0844f) },
  uSunDir: { value: new THREE.Vector3(0,1,0) },
  uSunColor: { value: new THREE.Color(0xffe9c8) },
  uMoonDir: { value: new THREE.Vector3(0,-1,0) },
  uMoonVis: { value: 0.0 },
  uDeep: { value: new THREE.Color(0x0a2430) },
  uShallow: { value: new THREE.Color(0x114156) },
  uSunPower: { value: 0.0 },
  uFogColor: { value: new THREE.Color(0x0a1220) },
  uFogDensity: { value: 0.0012 },
  uCamPos: { value: new THREE.Vector3() },
};
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  fog: false,
  vertexShader: `
    uniform float uTime;
    varying vec3 vWorldPos;
    varying vec3 vNormal;
    float wave(vec2 p, float t){
      float h = 0.0;
      h += sin(p.x*0.045 + t*0.9) * cos(p.y*0.038 - t*0.55) * 0.40;
      h += sin(p.x*0.11 - t*1.25 + p.y*0.07) * 0.16;
      h += sin((p.x+p.y)*0.021 + t*0.42) * 0.55;
      return h;
    }
    void main(){
      vec3 pos = position;
      float h = wave(pos.xy, uTime);
      float e = 0.7;
      float hx = wave(pos.xy + vec2(e,0.0), uTime);
      float hz = wave(pos.xy + vec2(0.0,e), uTime);
      vec3 tX = normalize(vec3(e, 0.0, hx - h));
      vec3 tZ = normalize(vec3(0.0, e, hz - h));
      vec3 n = normalize(cross(tX, tZ));
      vNormal = normalize(normalMatrix * n);
      vec3 displaced = vec3(pos.x, pos.y, h);
      vec4 wp = modelMatrix * vec4(displaced,1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 uSkyTop, uSkyHorizon, uSunDir, uSunColor, uMoonDir, uDeep, uShallow, uFogColor;
    uniform float uMoonVis, uSunPower, uFogDensity;
    uniform vec3 uCamPos;
    varying vec3 vWorldPos;
    varying vec3 vNormal;
    void main(){
      vec3 N = normalize(vNormal);
      vec3 V = normalize(uCamPos - vWorldPos);
      vec3 L = normalize(uSunDir);

      float fresnel = pow(1.0 - clamp(dot(N,V),0.0,1.0), 3.2);
      vec3 skyRefl = mix(uSkyHorizon, uSkyTop, clamp(N.y*0.5+0.5,0.0,1.0));
      vec3 base = mix(uDeep, uShallow, 0.18);
      vec3 color = mix(base, skyRefl, clamp(fresnel,0.0,0.88));

      vec3 H = normalize(L+V);
      float spec = pow(max(dot(N,H),0.0), 150.0);
      float glint = pow(max(dot(N,H),0.0), 14.0) * 0.16;
      color += uSunColor * (spec*1.7 + glint) * uSunPower;

      vec3 Lm = normalize(uMoonDir);
      vec3 Hm = normalize(Lm+V);
      float specM = pow(max(dot(N,Hm),0.0), 200.0);
      color += vec3(0.8,0.86,0.95) * specM * uMoonVis * 0.8;

      float dist = length(uCamPos - vWorldPos);
      float fogF = 1.0 - exp(-pow(uFogDensity*dist, 1.5));
      color = mix(color, uFogColor, clamp(fogF,0.0,1.0));

      gl_FragColor = vec4(color, 1.0);
    }
  `
});

function landRadius(angle){
  let r = 300;
  r += Math.sin(angle*2.0 + 1.3) * 55;
  r += Math.sin(angle*3.0 + 0.4) * 26;
  r += Math.sin(angle*5.0 + 2.1) * 13;
  const bay = Math.exp(-Math.pow(angleDiff(angle,0)/0.55, 2));
  r -= bay*172;
  const bay2 = Math.exp(-Math.pow(angleDiff(angle,2.5)/0.42, 2));
  r += bay2*38;
  return Math.max(70, r);
}
function terrainHeight(x,z){
  const r = Math.hypot(x,z);
  const ang = Math.atan2(x,z);
  const coastR = landRadius(ang);
  const hillCore = Math.max(0, 1 - r/260);
  let h = Math.pow(hillCore, 1.5) * 30;
  h += (fbm(x*0.018, z*0.018, 4) - 0.5) * 9;
  h = Math.max(h, 1.0);
  const plazaBlend = smoothstep(20, 46, r);
  h = THREE.MathUtils.lerp(PLAZA_Y, h, plazaBlend);
  if(r > coastR){
    const t = Math.min(1, (r-coastR)/42);
    h = THREE.MathUtils.lerp(h, -42, t*t);
  } else {
    const shoreT = smoothstep(coastR-20, coastR, r);
    h = THREE.MathUtils.lerp(h, Math.min(h,1.6), shoreT);
  }
  return h;
}
function buildLand(segs, extent, colorNear, colorFar, farCenter){
  const geo = new THREE.PlaneGeometry(extent, extent, segs, segs);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count*3);
  const cSand = new THREE.Color(0xcdb98f), cEarth = new THREE.Color(0x7c7154), cGreen = new THREE.Color(0x5f6b45), cRock = new THREE.Color(0x8a8272);
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i) + farCenter.x;
    const z = pos.getZ(i) + farCenter.z;
    const h = terrainHeight(x,z);
    pos.setY(i, h - farCenter.y);
    const ang = Math.atan2(x,z);
    const coastR = landRadius(ang);
    const r = Math.hypot(x,z);
    const distCoast = coastR - r;
    let c;
    if(distCoast < 9) c = cSand.clone().lerp(cEarth, THREE.MathUtils.clamp(distCoast/9,0,1));
    else {
      c = cEarth.clone().lerp(cGreen, THREE.MathUtils.clamp((h-4)/26,0,1));
      const slope = THREE.MathUtils.clamp((h-16)/22,0,1);
      c.lerp(cRock, slope*0.35);
    }
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.98, metalness:0.0 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(farCenter);
  mesh.receiveShadow = true;
  return mesh;
}

/* ------------------------------- tower geometry ------------------------------- */
function archShape(width, height, radius){
  const w2 = width/2;
  const s = new THREE.Shape();
  s.moveTo(-w2, 0);
  s.lineTo(-w2, height);
  s.absarc(0, height, radius, Math.PI, 0, true);
  s.lineTo(w2, 0);
  s.lineTo(-w2, 0);
  return s;
}
function archGeometry(width, height, depth){
  const radius = width/2;
  const geo = new THREE.ExtrudeGeometry(archShape(width, height, radius), { depth, bevelEnabled:false, curveSegments:14 });
  geo.translate(0,0,-depth/2);
  return geo;
}

  const positions = [];

  const treeGeo = new THREE.ConeGeometry(1.1,2.6,8);

  };

const birdCenter = new THREE.Vector3(0, 54+PLAZA_Y, 0);
function updateBirds(dt, t){
  for(const b of birds){
    const sep = new THREE.Vector3(), ali = new THREE.Vector3(), coh = new THREE.Vector3();
    let count = 0;
    for(const o of birds){
      if(o===b) continue;
      const d = b.pos.distanceTo(o.pos);
      if(d < 11 && d > 0.001) sep.add(new THREE.Vector3().subVectors(b.pos,o.pos).normalize().divideScalar(d));
      if(d < 38){ ali.add(o.vel); coh.add(o.pos); count++; }
    }
    const steer = new THREE.Vector3();
    if(count>0){
      ali.divideScalar(count);
      coh.divideScalar(count).sub(b.pos);
      if(ali.lengthSq()>1e-6) steer.addScaledVector(ali.normalize(), 0.45);
      if(coh.lengthSq()>1e-6) steer.addScaledVector(coh.normalize(), 0.5);
    }
    steer.addScaledVector(sep, 1.7);
    const toCenter = new THREE.Vector3().subVectors(birdCenter, b.pos);
    const distC = toCenter.length();
    const desired = distC - 52;
    if(distC>0.001) steer.addScaledVector(toCenter.normalize(), THREE.MathUtils.clamp(desired*0.02,-0.6,0.6));
    steer.y += (birdCenter.y - b.pos.y) * 0.012;

    b.vel.addScaledVector(steer, dt);
    b.vel.y *= 0.985;
    const speed = b.vel.length();
    const maxSpd=9.5, minSpd=4.2;
    if(speed>maxSpd) b.vel.multiplyScalar(maxSpd/speed);
    else if(speed<minSpd && speed>0.001) b.vel.multiplyScalar(minSpd/speed);
    b.pos.addScaledVector(b.vel, dt);

    b.group.position.copy(b.pos);
    const dir = b.vel.clone().normalize();
    if(dir.lengthSq()>0.001) b.group.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), dir);
    const flap = Math.sin(t*9 + b.phase)*0.5+0.5;
    b.wingL.rotation.z = 0.18 + flap*0.55;
    b.wingR.rotation.z = -(0.18 + flap*0.55);
  }
}

];
const _c1=new THREE.Color(), _c2=new THREE.Color();
function sampleKeys(t){
  t = ((t%24)+24)%24;
  let a = KEYS[0], b = KEYS[KEYS.length-1];
  for(let i=0;i<KEYS.length-1;i++){
    if(t >= KEYS[i].t && t <= KEYS[i+1].t){ a = KEYS[i]; b = KEYS[i+1]; break; }
  }
  const span = (b.t-a.t) || 1;
  const f = (t - a.t)/span;
  const out = {};
  out.top = _c1.set(a.top).clone().lerp(_c2.set(b.top), f);
  out.hor = _c1.set(a.hor).clone().lerp(_c2.set(b.hor), f);
  out.sun = _c1.set(a.sun).clone().lerp(_c2.set(b.sun), f);
  ['sunI','hemiI','fogD','night','amb','exposure'].forEach(k=>{ out[k] = THREE.MathUtils.lerp(a[k], b[k], f); });
  out.hemiS = _c1.set(a.hemiS).clone().lerp(_c2.set(b.hemiS), f);
  out.hemiG = _c1.set(a.hemiG).clone().lerp(_c2.set(b.hemiG), f);
  return out;
}

const sunDirVisual = new THREE.Vector3();
const sunDirLight = new THREE.Vector3();
const moonDir = new THREE.Vector3();

function applyTimeOfDay(hours){
  const s = sampleKeys(hours);
  const a = ((hours-6)/24) * Math.PI * 2;
  sunDirVisual.set(Math.cos(a), Math.sin(a), 0.32).normalize();
  moonDir.copy(sunDirVisual).multiplyScalar(-1);
  sunDirLight.copy(sunDirVisual);
  sunDirLight.y = Math.max(sunDirVisual.y, 0.05);

  skyUniforms.uTop.value.copy(s.top);
  skyUniforms.uHorizon.value.copy(s.hor);
  skyUniforms.uSunDir.value.copy(sunDirVisual);
  skyUniforms.uSunColor.value.copy(s.sun);
  skyUniforms.uMoonDir.value.copy(moonDir);
  skyUniforms.uMoonVis.value = smoothstep(0.15,0.5,s.night);
  skyUniforms.uStar.value = smoothstep(0.6,1.0,s.night) * 0.9;

  waterUniforms.uSkyTop.value.copy(s.top);
  waterUniforms.uSkyHorizon.value.copy(s.hor);
  waterUniforms.uSunDir.value.copy(sunDirVisual);
  waterUniforms.uSunColor.value.copy(s.sun);
  waterUniforms.uMoonDir.value.copy(moonDir);
  waterUniforms.uMoonVis.value = skyUniforms.uMoonVis.value;
  waterUniforms.uSunPower.value = Math.max(sunDirVisual.y, 0.0);
  waterUniforms.uFogColor.value.copy(s.hor);
  waterUniforms.uFogDensity.value = s.fogD;
  waterUniforms.uCamPos.value.copy(camera.position);

  scene.fog.color.copy(s.hor);
  scene.fog.density = s.fogD;

  hemi.color.copy(s.hemiS);
  hemi.groundColor.copy(s.hemiG);
  hemi.intensity = s.hemiI;
  ambient.intensity = s.amb;

  sun.position.copy(sunDirLight).multiplyScalar(140).add(new THREE.Vector3(0,30,0));
  sun.target.position.set(0,30,0);
  sun.color.copy(s.sun);
  sun.intensity = s.sunI;

  moon.position.copy(moonDir).multiplyScalar(140).add(new THREE.Vector3(0,30,0));
  moon.target.position.set(0,30,0);
  moon.intensity = s.night * 0.30;
  if(!moon.target.parent) scene.add(moon.target);

  const nightGlow = smoothstep(0.35,0.75,s.night);
  windowMat.emissiveIntensity = nightGlow * 1.9;
  buildingMat.emissiveIntensity = nightGlow * 1.5;
  floodLights.forEach(fl=>{ fl.intensity = nightGlow * 2600; });
  dynMats.forEach(m=>{ if(m && m.userData && m.userData.isGlow){ m.opacity = nightGlow*0.85; } });
  if(window.__waterGlow) window.__waterGlow.material.opacity = nightGlow*0.4;

  renderer.toneMappingExposure = s.exposure;

  // UI
  const hh = Math.floor(hours)%24, mm = Math.floor((hours%1)*60);
  clockEl.textContent = String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  let phase = 'Gece';
  if(hours>=5.2 && hours<7.5) phase='Şafak';
  else if(hours>=7.5 && hours<16.8) phase='Gündüz';
  else if(hours>=16.8 && hours<19) phase='Akşam Üzeri';
  else if(hours>=19 && hours<20.6) phase='Alacakaranlık';
  phaseLabelEl.textContent = phase;
}

/* --------------------------------- camera tour --------------------------------- */
const tourPts = [
  new THREE.Vector3(0, 95+PLAZA_Y, 235),
  new THREE.Vector3(150, 66+PLAZA_Y, 130),
  new THREE.Vector3(205, 44+PLAZA_Y, -42),
  new THREE.Vector3(92, 108+PLAZA_Y, -195),
  new THREE.Vector3(-125, 60+PLAZA_Y, -155),
  new THREE.Vector3(-196, 40+PLAZA_Y, 18),
  new THREE.Vector3(-112, 74+PLAZA_Y, 165),
];
const tourCurve = new THREE.CatmullRomCurve3(tourPts, true, 'catmullrom', 0.5);
const TOUR_DURATION = 52;
let tourT = 0;
function updateTour(dt){
  tourT = (tourT + dt/TOUR_DURATION) % 1;
  const p = tourCurve.getPointAt(tourT);
  camera.position.copy(p);
  const ty = 30 + PLAZA_Y + 11*Math.sin(tourT*Math.PI*2*2);
  camera.lookAt(0, ty, 0);
}

/* ------------------------------------- UI ------------------------------------- */
const clockEl = document.getElementById('clock');
const phaseLabelEl = document.getElementById('phaseLabel');
const playBtn = document.getElementById('playBtn');
const timeSlider = document.getElementById('timeSlider');
const camFreeBtn = document.getElementById('camFree');
const camTourBtn = document.getElementById('camTour');
const factToggle = document.getElementById('factToggle');
const factEl = document.getElementById('fact');
const compassNeedle = document.getElementById('compassNeedle');

const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

let autoTime = true;
let timeHours = 18.4;
const CYCLE_SECONDS = 480;
let camMode = 'free';

function setPlaying(v){
  autoTime = v;
  playBtn.innerHTML = v ? ICON_PAUSE : ICON_PLAY;
  playBtn.setAttribute('aria-pressed', String(v));
}
setPlaying(true);
timeSlider.value = String(Math.round(timeHours*60));

playBtn.addEventListener('click', ()=> setPlaying(!autoTime));
timeSlider.addEventListener('input', ()=>{
  setPlaying(false);
  timeHours = (+timeSlider.value)/60;
});
factToggle.addEventListener('click', ()=>{
  const show = !factEl.classList.contains('show');
  factEl.classList.toggle('show', show);
  factToggle.setAttribute('aria-expanded', String(show));
});

function setCamMode(mode){
  camMode = mode;
  camFreeBtn.classList.toggle('active', mode==='free');
  camTourBtn.classList.toggle('active', mode==='tour');
  camFreeBtn.setAttribute('aria-pressed', String(mode==='free'));
  camTourBtn.setAttribute('aria-pressed', String(mode==='tour'));
  controls.enabled = (mode==='free');
  if(mode==='free'){ controls.target.set(0,30+PLAZA_Y,0); controls.update(); }
}
camFreeBtn.addEventListener('click', ()=> setCamMode('free'));
camTourBtn.addEventListener('click', ()=> setCamMode('tour'));

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ------------------------------------- loop ------------------------------------- */
const veil = document.getElementById('veil');
const clock = new THREE.Clock();
let frames = 0;

function animate(){
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  if(autoTime) timeHours = (timeHours + dt*(24/CYCLE_SECONDS)) % 24;
  if(Math.abs((+timeSlider.value)/60 - timeHours) > 0.02){
    timeSlider.value = String(Math.round(timeHours*60));
  }
  applyTimeOfDay(timeHours);

  waterUniforms.uTime.value = t;
  skyUniforms.uTime.value = t;
  updateBirds(dt, t);
  updateBoats(dt);

  if(window.__flagGeo && window.__flagMesh){
    const posAttr = window.__flagGeo.attributes.position;
    for(let i=0;i<posAttr.count;i++){
      const x = posAttr.getX(i);
      const wave = Math.sin(t*5 + x*2.4) * 0.09 * (x/1.7);
      posAttr.setZ(i, wave);
    }
    posAttr.needsUpdate = true;
  }

  if(camMode==='free'){
    controls.update();
  } else {
    updateTour(dt);
  }

  const a = -Math.atan2(camera.position.x - controls.target.x, -(camera.position.z - controls.target.z));
  compassNeedle.setAttribute('transform', `rotate(${THREE.MathUtils.radToDeg(a)} 20 20)`);

  renderer.render(scene, camera);
  frames++;
  if(frames===2){ veil.classList.add('hide'); }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>

</body></html>
