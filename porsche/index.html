<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Porsche 911 GT3 RS (992) — procedural</title>
<style>
  html,body{margin:0;height:100%;background:#0b0c0e;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;color:#e9e9ea}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;cursor:grab}
  canvas#c:active{cursor:grabbing}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,#15171b 0%,#0b0c0e 70%);z-index:10;transition:opacity .6s}
  #loading .t{letter-spacing:.42em;font-size:12px;font-weight:300;text-transform:uppercase;opacity:.8;padding-left:.42em}
  #loading .bar{width:240px;height:1px;background:rgba(255,255,255,.12);margin-top:20px;overflow:hidden}
  #loading .bar i{display:block;height:100%;width:0;background:#d5001c;transition:width .25s}
  #loading .s{margin-top:14px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.42;min-height:14px}
  #ui{position:fixed;inset:0;z-index:5}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="loading"><div class="t">911 GT3 RS</div><div class="bar"><i id="loadbar"></i></div><div class="s" id="loadtext">starting…</div></div>
<div id="ui"></div>
<noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0c0e;z-index:20;letter-spacing:.2em;font-size:12px;text-transform:uppercase">JavaScript is required</div></noscript>
<!-- fixed load order (see ARCHITECTURE.md) -->
<script src="js/core.js"></script>
<script src="js/geo.js"></script>
<script src="js/sdf.js"></script>
<script src="js/renderer.js"></script>
<script src="js/car/spec.js"></script>
<script src="js/car/body.js"></script>
<script src="js/car/wheels.js"></script>
<script src="js/car/aero.js"></script>
<script src="js/car/lights.js"></script>
<script src="js/car/details.js"></script>
<script src="js/car/interior.js"></script>
<script src="js/app.js"></script>
</body>
</html>
