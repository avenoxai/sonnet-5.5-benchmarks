// ------------------------------------------------------------------------------------------------------------------
// Contact sheet for PG.geo.  URL params:  sheet=1..5  mode=shade|normals|uv  wire=0|1|only  size=WxH (cell grid, default 5x3)
// Self-contained viewer (own WebGL2 program: Lambert + rim; does not use renderer.js).
// ------------------------------------------------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
const G = PG.geo, m4 = PG.m4, PI = Math.PI, TAU = PI * 2, shapes = G.shapes;
const SHEET = +(Q.get('sheet') || 1), MODE = Q.get('mode') || 'shade', WIRE = Q.get('wire') || '0';
const [COLS, ROWS] = (Q.get('grid') || (SHEET === 5 ? '3x1' : '5x3')).split('x').map(Number);
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
if (!gl) { document.body.textContent = 'WebGL2 not available'; throw new Error('no webgl2'); }
const results = { sheet: SHEET, items: [], failures: 0 };

// ---------------------------------------------------------------- tiny renderer
const VS = `#version 300 es
in vec3 aPos; in vec3 aNrm; in vec2 aUv; uniform mat4 uVP;
out vec3 vN; out vec3 vP; out vec2 vUv;
void main(){ vN = aNrm; vP = aPos; vUv = aUv; gl_Position = uVP * vec4(aPos, 1.0); }`;
const FS = `#version 300 es
precision highp float; in vec3 vN; in vec3 vP; in vec2 vUv; out vec4 o;
uniform vec3 uEye; uniform int uMode; uniform float uPeriod; uniform vec3 uColor;
void main(){
  vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
  vec3 v = normalize(uEye - vP);
  if (uMode == 3) { o = vec4(uColor, 1.0); return; }
  vec3 base = uColor;
  if (uMode == 1) base = n * 0.5 + 0.5;
  if (uMode == 2) { vec2 g = floor(vUv / uPeriod); float c = mod(g.x + g.y, 2.0); base = mix(vec3(0.85,0.87,0.9), vec3(0.18,0.2,0.26), c); base = mix(base, vec3(vUv.x/(uPeriod*8.0), vUv.y/(uPeriod*8.0), 0.55), 0.18); }
  vec3 L1 = normalize(vec3(0.5, 0.85, 0.45)), L2 = normalize(vec3(-0.7, 0.2, -0.5));
  float d1 = max(dot(n, L1), 0.0), d2 = max(dot(n, L2), 0.0);
  float hemi = 0.5 + 0.5 * n.y;
  vec3 col = base * (0.18 + 0.22 * hemi + 0.75 * d1 + 0.22 * d2);
  float rim = pow(1.0 - max(dot(n, v), 0.0), 3.0); col += vec3(0.35, 0.45, 0.6) * rim * 0.6;
  vec3 h = normalize(L1 + v); col += vec3(1.0) * pow(max(dot(n, h), 0.0), 60.0) * 0.25;
  if (!gl_FrontFacing) col = mix(col, vec3(1.0, 0.1, 0.1), 0.65);   // back faces (seen from inside) glow red
  if (uMode == 1 && gl_FrontFacing) col = base * 0.9 + col * 0.1;
  o = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
}`;
const prog = PG.glu.program(gl, VS, FS, 'geo-test'), U = PG.glu.uniforms(gl, prog);
const LOC = { aPos: 0, aNrm: 1, aUv: 2 };
function upload(mesh, wire) {
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf = (data, loc, size) => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0); };
  buf(mesh.positions, 0, 3); buf(mesh.normals, 1, 3); buf(mesh.uvs || new Float32Array(mesh.positions.length / 3 * 2), 2, 2);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.indices, gl.STATIC_DRAW);
  let wvao = null, wcount = 0;
  if (wire) {
    const set = new Set(), lines = [], I = mesh.indices;
    for (let t = 0; t < I.length; t += 3) for (let k = 0; k < 3; k++) { const a = I[t + k], b = I[t + (k + 1) % 3], key = a < b ? a * 4294967296 + b : b * 4294967296 + a; if (!set.has(key)) { set.add(key); lines.push(a, b); } }
    wvao = gl.createVertexArray(); gl.bindVertexArray(wvao);
    buf(mesh.positions, 0, 3); buf(mesh.normals, 1, 3); buf(mesh.uvs || new Float32Array(mesh.positions.length / 3 * 2), 2, 2);
    const lb = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, lb); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, Uint32Array.from(lines), gl.STATIC_DRAW); wcount = lines.length;
  }
  gl.bindVertexArray(null);
  return { vao, count: mesh.indices.length, wvao, wcount };
}
gl.bindAttribLocation(prog, 0, 'aPos'); gl.bindAttribLocation(prog, 1, 'aNrm'); gl.bindAttribLocation(prog, 2, 'aUv'); gl.linkProgram(prog);

// ---------------------------------------------------------------- items

function ringLoft(stations, n) {   // car-ish fuselage: stations [{x, w, h, y, p}] -> sections in the YZ plane, closed superellipses
  return stations.map(s => { const r = []; for (let i = 0; i < n; i++) { const a = i / n * TAU, c = Math.cos(a), sn = Math.sin(a), e = 2 / (s.p || 2.6); r.push([s.x, s.y + s.h * Math.sign(sn) * Math.pow(Math.abs(sn), e), s.w * Math.sign(c) * Math.pow(Math.abs(c), e)]); } return r; });
}

      ['bevel/uv unit mode box', () => G.box(0.8, 0.5, 0.8, { radius: 0.08, uv: 'unit' }), { rot: [30, 40], uv: true }],
      ['uvScale [2,1] cylinder', () => G.cylinder(0.35, 0.35, 0.9, 32, 1, { uvScale: [2, 1] }), { rot: [30, 40], uv: true }],
    ];
    function blob(n, unweldedFlat) {
      const m = G.cubeSphere(0.6, 16), P = m.positions;
      for (let i = 0; i < P.length; i += 3) { const x = P[i], y = P[i + 1], z = P[i + 2], k = 1 + 0.22 * Math.sin(x * 5.3 + 1) * Math.sin(y * 4.1) * Math.cos(z * 4.7 + 2) + 0.06 * Math.sin(x * 15 + y * 12); P[i] *= k; P[i + 1] *= k; P[i + 2] *= k; }

  5: [],   // raycaster demos are built procedurally below
};

// ---------------------------------------------------------------- raycaster sheet
function raycasterSheet() {
  const out = [];
  const txt = [];
  const t = (s, ok = true) => { txt.push({ s, ok }); if (!ok) results.failures++; };
  // analytic tests
  const sph = G.sphere(1, 96, 48), rc = G.raycaster(sph);
  let maxE = 0, miss = 0;
  for (let i = 0; i < 3000; i++) { const a = i * 2.399963, b = Math.acos(1 - 2 * ((i + 0.5) / 3000)), d = [Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a)]; const h = rc.cast(d.map(v => v * 4), d.map(v => -v)); if (!h) miss++; else maxE = Math.max(maxE, Math.abs(h.t - 3)); }
  t(`sphere r=1 (96x48): 3000 inward rays, misses ${miss}, max |t-3| = ${maxE.toExponential(2)} (tessellation limit ~5e-4)`, miss === 0 && maxE < 1.5e-3);
  const ca = rc.castAll([0, 0.2, -3], [0, 0, 1]); t(`castAll through sphere: ${ca.length} hits at t=${ca.map(h => h.t.toFixed(4)).join(', ')} (expect 2: 3-sqrt(0.96)=2.0202.. / 3.9798..), front flags ${ca.map(h => h.front)}`, ca.length === 2 && ca[0].front && !ca[1].front && Math.abs(ca[0].t - (3 - Math.sqrt(0.96))) < 2e-3);
  const hy = rc.heightAt(0.3, 0.4); t(`heightAt(0.3,0.4) = ${hy.toFixed(5)} (expect ${Math.sqrt(0.75).toFixed(5)})`, Math.abs(hy - Math.sqrt(0.75)) < 1e-3);
  const nr = rc.nearest([2, 1, 0]); t(`nearest([2,1,0]) dist ${nr.distance.toFixed(4)} (expect ${(Math.hypot(2, 1) - 1).toFixed(4)})`, Math.abs(nr.distance - (Math.hypot(2, 1) - 1)) < 2e-3);
  const box = T(G.box(2, 1, 3), 0, 0.5, 0), rb = G.raycaster(box);
  let bh = rb.cast([5, 0.3, 0.2], [-1, 0, 0]); t(`box 2x1x3: cast -X from x=5: t=${bh.t.toFixed(6)} (expect 4) normal ${bh.normal.map(v => v.toFixed(2))} front=${bh.front}`, Math.abs(bh.t - 4) < 1e-6 && bh.normal[0] === 1);
  bh = rb.cast([0.3, 3, -0.4], [0, -1, 0]); t(`box: heightAt(0.3,-0.4)=${rb.heightAt(0.3, -0.4)} (expect 1)`, Math.abs(rb.heightAt(0.3, -0.4) - 1) < 1e-6);
  bh = rb.cast([-3, -3, 0], [1, 1, 0]); t(`box: diagonal ray through vertical edge/face diagonal hits: ${!!bh}`, !!bh);
  t(`box: backfaces:false ray from inside -> ${rb.cast([0, 0.5, 0], [1, 0, 0], { backfaces: false })}`, rb.cast([0, 0.5, 0], [1, 0, 0], { backfaces: false }) === null);
  // 1M triangles
  let t0 = performance.now(); const big = G.sphere(1, 1000, 500); const gen = performance.now() - t0;
  const rcb = G.raycaster(big); const nt = big.indices.length / 3;
  t(`1M mesh: ${nt} triangles, generated in ${gen.toFixed(0)} ms, BVH build ${rcb.stats.buildMs.toFixed(0)} ms (${rcb.stats.nodes} nodes, depth ${rcb.stats.depth})`, rcb.stats.buildMs < 1000);
  t0 = performance.now(); let hits = 0, err = 0; const NQ = 20000;
  for (let i = 0; i < NQ; i++) { const a = i * 2.399963, b = Math.acos(1 - 2 * ((i + 0.5) / NQ)), d = [Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a)]; const h = rcb.cast(d.map(v => v * 3), d.map(v => -v)); if (h) { hits++; err = Math.max(err, Math.abs(h.t - 2)); } }
  const us = (performance.now() - t0) / NQ * 1000; t(`cast on 1M tris: ${us.toFixed(2)} us/query, ${hits}/${NQ} hits, max err ${err.toExponential(1)}`, hits === NQ && us < 50);
  t0 = performance.now(); for (let i = 0; i < NQ; i++) rcb.heightAt(Math.cos(i) * 0.9, Math.sin(i * 1.3) * 0.5); t(`heightAt on 1M tris: ${((performance.now() - t0) / NQ * 1000).toFixed(2)} us/query`, true);
  t0 = performance.now(); for (let i = 0; i < 1000; i++) rcb.nearest([Math.cos(i) * 2, Math.sin(i * 1.3), Math.cos(i * 2.1) * 1.5]); t(`nearest on 1M tris: ${((performance.now() - t0) / 1000 * 1000).toFixed(1)} us/query`, true);
  results.timing = { buildMs: rcb.stats.buildMs, castUs: us };
  // visual: torus with rays
  const tor = G.torus(0.5, 0.2, 64, 24), rt = G.raycaster(tor), hitPts = [], rays = [];
  for (let i = 0; i < 40; i++) { const a = i / 40 * TAU, o = [Math.cos(a) * 1.2, 0.35 + 0.1 * Math.sin(i), Math.sin(a) * 1.2], target = [Math.cos(a + 0.4) * 0.5, 0, Math.sin(a + 0.4) * 0.5]; const d = [target[0] - o[0], target[1] - o[1], target[2] - o[2]]; const h = rt.cast(o, d); if (h) { hitPts.push(h.point); rays.push([o, h.point, h.normal]); } }
  const lines = rays.map(([o, p]) => { const d = [p[0] - o[0], p[1] - o[1], p[2] - o[2]], l = Math.hypot(...d); return G.transform(G.cylinder(0.004, 0.004, l, 5, 1), m4.chain(m4.translation((o[0] + p[0]) / 2, (o[1] + p[1]) / 2, (o[2] + p[2]) / 2), m4.rotationAxis([d[2], 0, -d[0]], Math.acos(d[1] / l)))); });
  const spikes = rays.map(([o, p, n]) => G.transform(G.cone(0.014, 0.08, 8), m4.chain(m4.translation(p[0] + n[0] * 0.04, p[1] + n[1] * 0.04, p[2] + n[2] * 0.04), m4.rotationAxis([n[2], 0, -n[0]], Math.acos(Math.max(-1, Math.min(1, n[1])))))));
  out.push(['raycast rays -> hits + normals (torus)', () => G.merge([tor].concat(lines, spikes)), { closed: false, rot: [40, 30] }]);
  // visual: shrink-wrap grid placing
  const blobm = (() => { const m = G.cubeSphere(0.7, 18), P = m.positions; for (let i = 0; i < P.length; i += 3) { P[i + 1] *= 0.5; const k = 1 + 0.12 * Math.sin(P[i] * 6) * Math.cos(P[i + 2] * 5); P[i] *= k; P[i + 2] *= k; } return G.computeNormals(m, 180); })(), rb2 = G.raycaster(blobm);
  const pegs = []; let placed = 0;
  for (let ix = -6; ix <= 6; ix++) for (let iz = -6; iz <= 6; iz++) { const x = ix * 0.1, z = iz * 0.1, y = rb2.heightAt(x, z); if (y !== null) { pegs.push(T(G.cylinder(0.018, 0.018, 0.1, 8, 1), x, y + 0.03, z)); placed++; } }
  out.push([`heightAt shrink-wrap: ${placed} pegs on a blob`, () => G.merge([blobm].concat(pegs)), { closed: false, rot: [40, 35] }]);
  // nearest demo
  const tk = G.tube(Array.from({ length: 80 }, (_, i) => { const a = i / 80 * TAU; return [Math.cos(a) * 0.5, Math.sin(a * 2) * 0.15, Math.sin(a) * 0.5]; }), 0.07, { closed: true, radialSegments: 14 }), rn = G.raycaster(tk);
  const bits = [];
  for (let i = 0; i < 24; i++) { const p = [Math.cos(i * 1.7) * 0.9, Math.sin(i * 2.3) * 0.5 + 0.1, Math.sin(i * 1.3) * 0.9], nn = rn.nearest(p); if (nn) { bits.push(T(G.sphere(0.02, 8, 4), p[0], p[1], p[2])); bits.push(T(G.sphere(0.012, 8, 4), nn.point[0], nn.point[1], nn.point[2])); const d = [nn.point[0] - p[0], nn.point[1] - p[1], nn.point[2] - p[2]], l = Math.hypot(...d); if (l > 1e-4) bits.push(G.transform(G.cylinder(0.003, 0.003, l, 4, 1), m4.chain(m4.translation((p[0] + nn.point[0]) / 2, (p[1] + nn.point[1]) / 2, (p[2] + nn.point[2]) / 2), m4.rotationAxis([d[2], 0, -d[0]], Math.acos(d[1] / l))))); } }
  out.push(['nearest(): probe -> closest surface point', () => G.merge([tk].concat(bits)), { closed: false, rot: [35, 30] }]);
  results.rayText = txt;
  return { items: out, text: txt };
}

// ---------------------------------------------------------------- build + draw
function build() {
  let items = SHEETS[SHEET] || [];
  let panelText = '';
  if (SHEET === 5) { const r = raycasterSheet(); items = r.items; panelText = r.text.map(x => (x.ok ? 'ok   ' : 'FAIL ') + x.s).join('\n'); }
  const cells = [];
  for (const [name, fn, meta] of items) {
    const t0 = performance.now(); let mesh, err = null;
    try { mesh = fn(); } catch (e) { err = e; console.error(name, e); results.failures++; }
    const ms = performance.now() - t0;
    if (!mesh) { cells.push({ name, err: String(err), meta: meta || {} }); continue; }
    const closed = (meta || {}).closed !== false, rep = G.validate(mesh, { expectClosed: closed });
    const b = G.bounds(mesh);
    if (!rep.ok) { results.failures++; console.error('validate failed: ' + name + ' :: ' + rep.issues.join('; ')); }
    results.items.push({ name, verts: rep.vertexCount, tris: rep.triCount, ok: rep.ok, closed: rep.closed, volume: +rep.volume.toFixed(4), area: +rep.area.toFixed(4), issues: rep.issues, ms: +ms.toFixed(1) });
    cells.push({ name, mesh, meta: meta || {}, rep, ms, b, gpu: upload(mesh, WIRE !== '0' || (meta || {}).wire) });
  }
  return { cells, panelText };
}

function render(cells, panelText) {
  const dpr = window.devicePixelRatio || 1, W = window.innerWidth, H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height); gl.disable(gl.SCISSOR_TEST); gl.clearColor(0.078, 0.086, 0.102, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.SCISSOR_TEST); gl.useProgram(prog);
  const panelH = SHEET === 5 ? 260 : 0, gridH = H - panelH, cw = W / COLS, ch = gridH / ROWS, pad = 4;
  document.getElementById('panel').style.display = SHEET === 5 ? 'block' : 'none'; document.getElementById('panel').textContent = panelText;
  cells.forEach((c, idx) => {
    const col = idx % COLS, row = Math.floor(idx / COLS), x = col * cw, y = row * ch;
    const lb = document.createElement('div'); lb.className = 'lb'; lb.style.left = (x + 8) + 'px'; lb.style.top = (y + 5) + 'px';
    if (!c.mesh) { lb.innerHTML = `<b>${c.name}</b>\n<span class="bad">ERROR ${c.err}</span>`; document.body.appendChild(lb); return; }
    const closedTxt = c.meta.closed === false ? 'open' : (c.rep.closed ? 'watertight' : 'NOT closed');
    lb.innerHTML = `<b>${c.name}</b>\n${c.rep.vertexCount}v ${c.rep.triCount}t  ${closedTxt}  ${c.ms.toFixed(1)}ms  <span class="${c.rep.ok ? 'ok' : 'bad'}">${c.rep.ok ? 'valid' : c.rep.issues.join('; ')}</span>`;
    document.body.appendChild(lb);
    // viewport (GL origin is bottom-left)
    const vx = Math.round((x + pad) * dpr), vy = Math.round((H - (y + ch) + pad) * dpr), vw = Math.round((cw - pad * 2) * dpr), vh = Math.round((ch - pad * 2) * dpr);
    gl.viewport(vx, vy, vw, vh); gl.scissor(vx, vy, vw, vh);
    gl.clearColor(0.108 + (idx % 2) * 0.012, 0.118 + (idx % 2) * 0.012, 0.14 + (idx % 2) * 0.012, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const az = ((c.meta.rot ? c.meta.rot[0] : 32) + (Q.get('spin') ? +Q.get('spin') : 0)) * PI / 180, el = (c.meta.rot ? c.meta.rot[1] : 24) * PI / 180;
    const fov = 32 * PI / 180, aspect = vw / vh, rad = Math.max(c.b.radius, 1e-3), dist = rad / Math.sin(fov / 2) * (aspect < 1 ? 1.1 / aspect : 1.05) * 0.86;
    const eye = [c.b.center[0] + dist * Math.cos(el) * Math.cos(az), c.b.center[1] + dist * Math.sin(el), c.b.center[2] + dist * Math.cos(el) * Math.sin(az)];
    const VP = m4.multiply(m4.perspective(fov, aspect, dist * 0.05, dist * 4), m4.lookAt(eye, c.b.center, [0, 1, 0]));
    gl.uniformMatrix4fv(U2.uVP, false, VP); gl.uniform3fv(U2.uEye, eye);
    const mode = c.meta.uv ? 'uv' : MODE, period = Math.pow(10, Math.floor(Math.log10(Math.max(c.b.diag, 1e-3) / 8)));
    gl.uniform1i(U2.uMode, mode === 'normals' ? 1 : mode === 'uv' ? 2 : 0); gl.uniform1f(U2.uPeriod, period); gl.uniform3f(U2.uColor, 0.62, 0.68, 0.78);
    const wire = WIRE !== '0' || c.meta.wire;
    if (WIRE !== 'only') {
      if (wire) { gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1, 1); }
      gl.bindVertexArray(c.gpu.vao); gl.drawElements(gl.TRIANGLES, c.gpu.count, gl.UNSIGNED_INT, 0); gl.disable(gl.POLYGON_OFFSET_FILL);
    }
    if (wire && c.gpu.wvao) { gl.uniform1i(U2.uMode, 3); gl.uniform3f(U2.uColor, 0.03, 0.05, 0.08); gl.bindVertexArray(c.gpu.wvao); gl.drawElements(gl.LINES, c.gpu.wcount, gl.UNSIGNED_INT, 0); }
  });
  gl.bindVertexArray(null);
  const err = gl.getError(); if (err) { console.error('GL error 0x' + err.toString(16)); results.failures++; }
}

const B = build();
render(B.cells, B.panelText);
results.glError = gl.getError();
window.__geoResults = results;
console.log('GEO_RESULTS ' + JSON.stringify({ sheet: SHEET, failures: results.failures, n: results.items.length, timing: results.timing }));
window.__ready = true;
</script>
</body></html>
