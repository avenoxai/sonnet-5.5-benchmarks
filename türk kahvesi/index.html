<title>Bir Fincan Kahvenin Yolculuğu</title>
<style>
  html, body { margin: 0; height: 100%; background: #efe9d8; font-family: "Bradley Hand", "Chalkboard SE", "Noteworthy", ui-rounded, system-ui, sans-serif; color: #1e2b7a; overflow: hidden; }
  #wrap { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
  canvas { display: block; background: #f4efe2; box-shadow: 0 6px 30px rgba(60, 40, 10, .18); cursor: pointer; }
  #play { position: absolute; top: calc(50% - 28px); left: 50%; transform: translate(-50%, -50%); border: 3px solid #1e2b7a; background: rgba(244, 239, 226, .92); color: #1e2b7a; font: 700 26px/1 inherit; font-family: inherit; padding: 18px 34px; border-radius: 40px 34px 42px 36px; cursor: pointer; box-shadow: 4px 5px 0 #f28c1e; }
  #play:hover { transform: translate(-50%, -50%) rotate(-1.5deg); }
  #wrap.playing #play { display: none; }
  #controls { width: min(100vw, calc(100vh - 56px)); height: 56px; display: flex; align-items: center; gap: 14px; font-size: 15px; }
  #barwrap { flex: 1; height: 10px; background: #e0d6bb; border-radius: 6px; cursor: pointer; overflow: hidden; }
  #bar { height: 100%; width: 0; background: #f28c1e; }
  #time { min-width: 110px; text-align: right; padding-right: 8px; }
  a.dl { color: #1e2b7a; padding-left: 8px; }
  body.capture #controls, body.capture #play { display: none; }
  body.capture #wrap { justify-content: flex-start; }
</style>
</head>
